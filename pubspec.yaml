name: wenshiji
description: 温时记 - 记录每一个重要时刻
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  uuid: ^4.5.3
  go_router: ^17.2.3
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  permission_handler: ^12.0.2
  location: ^8.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  riverpod_annotation: ^4.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  hyper_snackbar: ^0.11.3
  contribution_heatmap: ^0.5.3
  package_info_plus: ^10.1.0  
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.12.0  
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  fonts:
    - family: ZhiMangXing
      fonts:
        - asset: assets/fonts/ZhiMangXing-Regular.ttf