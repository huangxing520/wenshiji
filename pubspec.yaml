name: wenshiji
description: 温时记 - 记录每一个重要时刻
publish_to: 'none'
version: 0.0.7+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.24
  collection: ^1.18.0
  flutter_riverpod: ^3.3.1
  intl: ^0.20.3
  uuid: ^4.5.3
  go_router: ^17.3.0
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  google_fonts: ^8.1.0
  image_picker: ^1.2.3
  riverpod_annotation: ^4.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  hyper_snackbar: ^0.11.3
  contribution_heatmap: ^0.5.3
  package_info_plus: ^10.2.0  
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  app_settings: ^7.0.0
  webdav_client_plus: ^1.0.2
  firebase_crashlytics: ^5.2.4
  firebase_core: ^4.10.0
  logger: ^2.7.0 
  flutter_datetime_picker_plus: ^2.4.0
  workmanager: ^0.9.0+3
  lunar: ^1.7.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.16.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0  
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: ZhiMangXing
      fonts:
        - asset: assets/fonts/ZhiMangXing-Regular.ttf