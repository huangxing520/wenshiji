name: Flutter Android 自动构建 & 发布

# 触发规则：推送 v 开头的标签（如 v1.0.0）自动执行 | 支持手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 质量门禁：校验生成物与源一致 + 静态分析。
  # 生成物（*.g.dart / *.freezed.dart）同仓提交，若改了模型却忘记跑
  # build_runner，运行时才会暴露。这里提前在 CI 拦住。
  verify-generated:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 与 build-release 保持同一 JDK，避免两边行为不一致
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地开发版本保持一致（3.47.3）：不同 Flutter 版本的
          # analyzer/linter 规则集不同，版本不一致会导致本地无告警
          # 而 CI 报 warning（v0.1.0 的 run #16 即因此失败）。
          flutter-version: 3.47.3
          channel: stable

      - name: 获取 Flutter 依赖
        run: flutter pub get

      - name: 重新生成代码生成物
        run: dart run build_runner build --delete-conflicting-outputs

      # 若上一步产生了改动，说明提交里的生成物已过期
      - name: 校验生成物与源一致
        run: |
          # 说明：riverpod 生成的 `String _$xxxNotifierHash()` 依赖构建缓存状态，
          # 清缓存后重建即变化（本地可复现），无法跨环境（CI 全新 checkout）一致。
          # 故仅校验生成物目录中除 hash 行以外的内容。
          paths="lib/models/generated lib/providers/generated lib/database/generated"
          git diff -- $paths > gen.diff 2>/dev/null || true
          if ! grep -E '^[+-]' gen.diff | grep -v '^[+-][+-]' | grep -v 'NotifierHash' | grep -q .; then
            echo "生成物校验通过（已忽略 riverpod hash 行）"
            exit 0
          fi
          echo "::error::代码生成物已过期，请本地运行 dart run build_runner build 后重新提交："
          git status --porcelain --untracked-files=no -- $paths
          git diff -- $paths
          exit 1

      - name: 静态分析
        # 门禁级别说明：
        # - flutter analyze 默认把 info 级 lint 也计为失败退出码，
        #   故不直接依赖其退出码，而是解析输出；
        # - 以 error 为门禁：warning 仍会打印以便收敛，但不阻断发布。
        #   原因：不同 Flutter 版本的 analyzer/linter 规则集存在差异
        #   （本地 3.47.3 与 CI 旧版本曾不一致），将 warning 设为门禁
        #   会因工具版本而非代码问题阻断发布。
        run: |
          flutter analyze lib 2>&1 | tee analyze_output.txt
          warning_count=$(grep -cE '^ *warning' analyze_output.txt || true)
          info_count=$(grep -cE '^ *info' analyze_output.txt || true)
          if grep -qE '^ *error' analyze_output.txt; then
            echo "::error::静态分析存在 error，请修复后再提交"
            grep -E '^ *error' analyze_output.txt || true
            exit 1
          fi
          echo "静态分析通过（无 error）。warning: ${warning_count} 条 / info: ${info_count} 条（仅提示）"

  build-release:
    runs-on: ubuntu-latest
    # 生成物校验通过后才构建发布
    needs: verify-generated
    steps:
      # 1. 拉取项目代码
      - name: 拉取代码
        uses: actions/checkout@v4
      # 3. 配置 Java 环境（Android 必须）
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # Eclipse Temurin (Adoptium)，稳定可靠
          java-version: '17'
          cache: 'gradle'  # 缓存Gradle依赖，加速构建
      # 2. 配置 Flutter 环境 🔴【唯一需要修改的地方：Flutter 版本】
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地开发版本保持一致（3.47.3）：不同 Flutter 版本的
          # analyzer/linter 规则集不同，版本不一致会导致本地无告警
          # 而 CI 报 warning（v0.1.0 的 run #16 即因此失败）。
          flutter-version: 3.47.3
          channel: stable

      
      # 4. 安装项目依赖
      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 5. 配置签名文件（自动从 GitHub 密钥读取，无需手动上传）
      - name: 生成签名文件
        run: |
          cd android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/wenshuji-release-key.jks
          echo "storeFile=wenshuji-release-key.jks" > key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties

      # 6. 构建 Release 版 APK
      - name: 编译生成 APK
        run: flutter build apk --split-per-abi

      # 7. 自动发布到 GitHub Release
      - name: 发布 APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name:  ${{ github.ref_name }}
          body: |
            🚀 自动构建完成
            版本：${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}